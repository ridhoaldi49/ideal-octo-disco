            border-radius: 18px;
            box-shadow:

            overflow: hidden;
            width: 100%;
            padding: 20px;

        .card::before {
            content: "";

            z-index: 0;

        @keyframes neonWave {

            }

            z-index: 1;

            left: -3px;
            right: -3px;
            bottom: -3px;

            left: 3px;
            right: 3px;
            bottom: 3px;

            border-radius: 10px;
            z-index: -1;

        @keyframes rotateBorder {
